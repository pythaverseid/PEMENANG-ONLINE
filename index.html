<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIROC 2026 — Tim Lolos Babak Selanjutnya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060d1a;--ink:#f1f5f9;--mute:#8da0b8;--line:rgba(255,255,255,.1);--card:rgba(13,23,42,.8);--ok:#4ade80}
body{min-height:100vh;font-family:"Space Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 8%,rgba(34,211,238,.16),transparent 30%),radial-gradient(circle at 90% 18%,rgba(251,113,133,.13),transparent 30%),radial-gradient(circle at 50% 100%,rgba(251,191,36,.1),transparent 35%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/44px 44px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wrap{width:min(1080px,92%);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:#22d3ee;box-shadow:0 0 0 0 #22d3ee;animation:ping 2s infinite}
.tag{font-size:.8rem;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:7px 13px}
.page{display:none;padding:30px 0 70px}.page.on{display:block}
.hero{text-align:center;padding:40px 0 30px}
.hero h1{font-size:clamp(2.6rem,8vw,6rem);line-height:.95;letter-spacing:-.05em;font-weight:700;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero p{max-width:560px;margin:22px auto 0;color:var(--mute);line-height:1.65;animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.cat{--a:#fb7185;--b:#fbbf24;position:relative;overflow:hidden;text-align:left;padding:28px;border-radius:28px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .3s,border-color .3s}
.cat.smp{--a:#22d3ee;--b:#8b5cf6}.cat.sma{--a:#fbbf24;--b:#f97316}
.cat:before{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-90px;border-radius:50%;background:radial-gradient(circle,var(--a),transparent 70%);opacity:.22;transition:opacity .3s}
.cat:hover,.cat:focus-visible{transform:translateY(-8px);border-color:var(--a)}.cat:hover:before{opacity:.45}
.disc{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 28%,transparent),color-mix(in srgb,var(--b) 18%,transparent));border:1px solid color-mix(in srgb,var(--a) 45%,transparent);margin-bottom:26px;position:relative}
.disc svg{width:62px;height:62px;overflow:visible}
.cat small{color:var(--a);font-weight:700;font-size:.85rem}
.cat h2{font-size:2rem;margin:4px 0 8px;letter-spacing:-.03em}
.cat p{color:var(--mute);line-height:1.55;font-size:.95rem}
.cat .n{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-weight:700;font-size:.9rem}
.cat .n b{background:var(--a);color:#06101e;border-radius:999px;padding:3px 11px}
.cat .n span{transition:transform .3s}.cat:hover .n span{transform:translateX(6px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.head .disc{margin:0 18px 0 0;flex:none}
.head .t{display:flex;align-items:center}
.head h2{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.045em;line-height:1}
.head small{color:var(--a);font-weight:700}
.back{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:11px 16px;cursor:pointer;transition:background .2s}
.back:hover{background:rgba(255,255,255,.12)}
.note{color:var(--mute);font-size:.88rem;line-height:1.6;max-width:640px;border-left:3px solid var(--a);padding-left:14px;margin-bottom:22px}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.tools input{flex:1;min-width:220px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tools span{color:var(--mute);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.w{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:transform .25s,border-color .25s;animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*35ms)}
.w:hover{transform:translateY(-4px);border-color:var(--a)}
.w svg{width:34px;height:34px;flex:none}
.w .ring{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .7s forwards;animation-delay:calc(var(--i)*35ms + .15s)}
.w .tick{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s forwards;animation-delay:calc(var(--i)*35ms + .5s)}
.w b{display:block;font-size:1.02rem;line-height:1.25;word-break:break-word}
.w em{font-style:normal;color:var(--ok);font-size:.78rem;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--mute);border:1px dashed var(--line);border-radius:20px}
.foot{text-align:center;color:#64748b;font-size:.8rem;margin-top:40px}
/* ikon beranimasi */
.float{animation:float 3s ease-in-out infinite;transform-origin:center}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .25s ease-in-out infinite alternate}
.bolt{animation:zap 1.6s ease-in-out infinite;transform-origin:center}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.pulse.d{animation-delay:.9s}
.star{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
.star.d{animation-delay:.8s}
.shine{animation:shine 2.6s ease-in-out infinite}
.cat:hover .float,.cat:hover .bolt{animation-duration:1.2s}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
@keyframes flame{to{transform:scaleY(1.5)}}
@keyframes zap{0%,100%{transform:scale(1);filter:drop-shadow(0 0 2px #22d3ee)}50%{transform:scale(1.14) rotate(-4deg);filter:drop-shadow(0 0 10px #22d3ee)}}
@keyframes pulse{from{transform:scale(.5);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1.2);opacity:1}}
@keyframes shine{0%{transform:translateX(-30px)}60%,100%{transform:translateX(60px)}}
@keyframes ping{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media(max-width:800px){.cats{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.head .disc{width:70px;height:70px;margin-right:12px}.head .disc svg{width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.w .ring,.w .tick{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="wrap top"><div class="brand"><i></i>AIROC 2026</div><div class="tag">Pengumuman Tim Lolos</div></header>
<main class="wrap">
  <section id="home" class="page on">
    <div class="hero">
      <h1>Selamat untuk<br>tim yang lolos</h1>
      <p>Pilih jenjang untuk melihat daftar tim yang melaju ke babak selanjutnya.</p>
    </div>
    <div class="cats" id="cats"></div>
  </section>
  <section id="detail" class="page"></section>
</main>
<div class="foot">AIROC 2026</div>
<script>
const ICON={
rocket:`<svg viewBox="0 0 64 64"><g class="float"><path class="flame" d="M27 46h10l-5 14z" fill="#fbbf24"/><path d="M32 4c9 7 12 18 10 34H22C20 22 23 11 32 4z" fill="#f8fafc"/><path d="M22 30l-9 12 10-2zM42 30l9 12-10-2z" fill="#fb7185"/><circle cx="32" cy="24" r="5" fill="#38bdf8"/><path d="M26 38h12v6H26z" fill="#fb7185"/></g></svg>`,
bolt:`<svg viewBox="0 0 64 64"><circle class="pulse" cx="32" cy="32" r="18" fill="none" stroke="#22d3ee" stroke-width="2"/><circle class="pulse d" cx="32" cy="32" r="18" fill="none" stroke="#8b5cf6" stroke-width="2"/><path class="bolt" d="M37 4L14 36h15l-4 24 25-34H35z" fill="#22d3ee"/></svg>`,
trophy:`<svg viewBox="0 0 64 64"><defs><clipPath id="c"><path d="M18 8h28v18a14 14 0 0 1-28 0z"/></clipPath></defs><path d="M18 14H8c0 10 4 16 12 17M46 14h10c0 10-4 16-12 17" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/><path d="M18 8h28v18a14 14 0 0 1-28 0z" fill="#fbbf24"/><g clip-path="url(#c)"><rect class="shine" x="-6" y="0" width="12" height="40" fill="#fff" opacity=".6" transform="skewX(-20)"/></g><path d="M29 40h6v8h-6z" fill="#f97316"/><rect x="20" y="48" width="24" height="8" rx="3" fill="#f97316"/><path class="star" d="M54 4l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/><path class="star d" d="M8 40l1.5 3.5L13 45l-3.5 1.5L8 50l-1.5-3.5L3 45l3.5-1.5z" fill="#fff"/></svg>`};
const DATA={
sd:{k:"SD",lv:"Explorer",big:"Elementary",ic:"rocket",desc:"Tingkat Sekolah Dasar.",teams:["Tim Zafer","Ghaisan","2BERSAUDARA","RISING STARS","Declan","ER Young Innovators","2BERSAUDARANEW_EXPLORER","British Hongkongs","Cool Jacksen","Duo Strike","Group Rahasia","IRHARA TEAM"]},
smp:{k:"SMP",lv:"Inovator",big:"Junior",ic:"bolt",desc:"Tingkat Sekolah Menengah Pertama.",teams:["SUPER TEAM","RoboTrone","OSARA","AK-47","Cyber X","STIMOY","HLC","VINI (kelompok dzaki & deniaz)","AK47","Averroes Robotic","Crescent Maech"]},
sma:{k:"SMA",lv:"Master",big:"Senior",ic:"trophy",desc:"Tingkat Sekolah Menengah Atas.",teams:["BODANG","katamamayuliharusmenang","roboX","DOUBLE NN","JagoanNeon","SKAJU BOT","Roborneo A","ROBORNEO B","garismiring","titikKoma","ETHERNAL","ROOT SMK-SMTI Makassar","IMMORTAL","ECHOFLUX","Gigeh Technobots","NEXORA","SkyoneAlpha_MASTER","SkyOneVictory_MASTER","SkyOnePhooenix_MASTER","Mirava","OTOMA_MASTER","CYBERLEAN","ICRC SMK ISLAM CENDIKA (SMK IC)_MASTER","SMK MUPA TECH FORSE"]}};
const CHECK=`<svg viewBox="0 0 36 36"><circle class="ring" cx="18" cy="18" r="15.9" fill="none" stroke="#4ade80" stroke-width="2.4" pathLength="100"/><path class="tick" d="M11 18.5l5 5 9-10" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="30"/></svg>`;
const $=s=>document.querySelector(s);
$('#cats').innerHTML=Object.entries(DATA).map(([id,d])=>`<article class="cat ${id}" tabindex="0" role="button" data-id="${id}"><div class="disc">${ICON[d.ic]}</div><small>${d.k} • ${d.lv}</small><h2>${d.big}</h2><p>${d.desc}</p><div class="n">Lihat daftar <span>→</span></div></article>`).join('');
document.querySelectorAll('.cat').forEach(c=>{const go=()=>show(c.dataset.id);c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
function show(id){
  const home=id==='home',p=$('#detail');
  $('#home').classList.toggle('on',home);p.classList.toggle('on',!home);
  window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'',home?'#':'#'+id);
  if(home)return;
  const d=DATA[id];
  const a={sd:['#fb7185','#fbbf24'],smp:['#22d3ee','#8b5cf6'],sma:['#fbbf24','#f97316']}[id];
  p.style.cssText=`--a:${a[0]};--b:${a[1]}`;
  p.innerHTML=`<div class="head"><div class="t"><div class="disc" style="--a:${a[0]};--b:${a[1]}">${ICON[d.ic]}</div><div><small>${d.k} • ${d.lv}</small><h2>Lolos babak selanjutnya</h2></div></div><button class="back">← Kembali</button></div>
  <p class="note">Berikut adalah daftar tim yang lolos ke babak selanjutnya. Gunakan kolom pencarian untuk menemukan nama tim.</p>
  <div class="tools"><input type="search" placeholder="Cari nama tim…" aria-label="Cari nama tim"></div><div class="grid"></div>`;
  p.querySelector('.back').onclick=()=>show('home');
  const inp=p.querySelector('input'),g=p.querySelector('.grid');
  const draw=()=>{const q=inp.value.trim().toLowerCase();g.innerHTML='';
    const list=d.teams.filter(t=>t.toLowerCase().includes(q));
    list.forEach((t,i)=>{const w=document.createElement('div');w.className='w';w.style.setProperty('--i',i);w.innerHTML=CHECK+'<div><b></b><em>Lolos</em></div>';w.querySelector('b').textContent=t;g.appendChild(w)});
    if(!list.length)g.innerHTML='<div class="empty">Tidak ada tim dengan nama itu. Coba kata kunci lain.</div>';
  };
  inp.oninput=draw;draw();
}
const h=location.hash.slice(1);if(DATA[h])show(h);
</script>
</body>
</html>
